[project]
name = "fite-host"
version = "0.1.0"
description = "Laptop server the phone dials into, starting with speech to text"
requires-python = ">=3.13"
dependencies = [
    "parakeet-mlx>=0.3",
    "pydantic>=2.7",
    "websockets>=14",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fite_host"]
